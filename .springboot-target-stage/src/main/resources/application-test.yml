spring:
  config:
    activate:
      on-profile: test
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none

ecommerce:
  cors:
    allowed-origins:
      - http://localhost:3000
  request:
    request-id-header: X-Request-Id
    max-body-bytes: 2097152
  security:
    issuer: local-test-issuer
    audience: ecommerce-api-test

