server:
  port: ${PORT:3057}
  servlet:
    context-path: /v1/api
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  forward-headers-strategy: framework
  tomcat:
    max-http-form-post-size: 2MB
    max-swallow-size: 2MB

spring:
  application:
    name: ecommerce-springboot
  profiles:
    default: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecommerce}
    username: ${SPRING_DATASOURCE_USERNAME:replace-me-local}
    password: ${SPRING_DATASOURCE_PASSWORD:replace-me-local}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${SPRING_MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SPRING_MAIL_STARTTLS:false}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_NOTIFICATION_GROUP_ID:ecommerce-spring-notifications-v1}
      enable-auto-commit: false
      auto-offset-reset: latest
      properties:
        isolation.level: read_committed
    producer:
      acks: all
      properties:
        enable.idempotence: true

management:
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: false

ecommerce:
  kafka:
    enabled: ${KAFKA_ENABLED:false}
    outbox-batch-size: ${KAFKA_OUTBOX_BATCH_SIZE:50}
    claim-timeout: ${KAFKA_OUTBOX_CLAIM_TIMEOUT:PT5M}
  jobs:
    order-expiration:
      enabled: ${ORDER_EXPIRATION_JOB_ENABLED:false}
      batch-size: ${ORDER_EXPIRATION_JOB_BATCH_SIZE:50}
      fixed-delay: ${ORDER_EXPIRATION_JOB_FIXED_DELAY:PT15M}
  stripe:
    enabled: ${STRIPE_ENABLED:false}
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    currency: ${STRIPE_CURRENCY:usd}
  google-oauth:
    enabled: ${GOOGLE_OAUTH_ENABLED:false}
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_CALLBACK_URL:{baseUrl}/v1/api/auth/auth/google/callback}
  password-reset:
    from-address: ${ECOMMERCE_PASSWORD_RESET_FROM:no-reply@example.test}
    reset-base-url: ${ECOMMERCE_PASSWORD_RESET_URL:http://localhost:3000/reset-password}
  cors:
    allowed-origins: ${ECOMMERCE_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  request:
    request-id-header: X-Request-Id
    max-body-bytes: 2097152
  security:
    issuer: ${ECOMMERCE_SECURITY_ISSUER:local-ecommerce}
    audience: ${ECOMMERCE_SECURITY_AUDIENCE:ecommerce-api}
    token-digest-pepper: ${ECOMMERCE_TOKEN_DIGEST_PEPPER:local-token-digest-pepper-change-me}
    legacy-max-token-bytes: 8192
    clock-skew-seconds: 60

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level service=ecommerce-springboot request_id=%X{requestId:-none} logger=%logger{36} message=%msg%n"
