spring:
  config:
    activate:
      on-profile: production
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    baseline-on-migrate: false
  mail:
    host: ${SPRING_MAIL_HOST}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

ecommerce:
  stripe:
    enabled: ${STRIPE_ENABLED:false}
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    currency: ${STRIPE_CURRENCY:usd}
  password-reset:
    from-address: ${ECOMMERCE_PASSWORD_RESET_FROM}
    reset-base-url: ${ECOMMERCE_PASSWORD_RESET_URL}
  cors:
    allowed-origins: ${ECOMMERCE_CORS_ALLOWED_ORIGINS}
  security:
    issuer: ${ECOMMERCE_SECURITY_ISSUER}
    audience: ${ECOMMERCE_SECURITY_AUDIENCE}
    token-digest-pepper: ${ECOMMERCE_TOKEN_DIGEST_PEPPER}
