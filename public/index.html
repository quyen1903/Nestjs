<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home page</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f8f9fa;
        }
        .hero {
            background: url('https://source.unsplash.com/1600x900/?technology,nature') center/cover no-repeat;
            height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: gray;
            font-weight: bold;
        }
        .hero h1 {
            font-size: 3rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        .btn-custom {
            background-color: #ff6f61;
            color: white;
            border-radius: 30px;
            padding: 12px 25px;
        }
        .btn-custom:hover {
            background-color: #ff4136;
        }
        footer {
            background: #343a40;
            color: white;
            padding: 15px 0;
            text-align: center;
        }
        .social-icons a {
            color: white;
            margin: 0 10px;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">MyWebsite</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#">Home page</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Service</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
                </ul>
            </div>
        </div>

    <!-- Hero Section -->
    <div class="hero">
        <div>
            <h1>Welcome to QuyenCommerce</h1>
            <p class="lead">Shopee Website Clone</p>
            <a href="#" class="btn btn-custom mt-3">Explore Now</a>
            <br>
            <a href="http://localhost:3056/v1/api/auth/google" class="btn btn-outline-danger mt-3" style="font-weight: bold; padding: 10px 20px; border-radius: 25px;">
                <i class="fab fa-google me-2"></i>Sign in with Google
            </a>
        </div>
    </div>


    <!-- Nội dung chính -->
    <div class="container my-5">
        <div class="row text-center">
            <div class="col-md-4">
                <i class="fas fa-bolt fa-3x text-primary"></i>
                <h3 class="mt-3">Fast</h3>
                <p>System optimized for high speed.</p>
            </div>
            <div class="col-md-4">
                <i class="fas fa-shield-alt fa-3x text-success"></i>
                <h3 class="mt-3">Security</h3>
                <p>Your information is always kept safe.</p>
            </div>
            <div class="col-md-4">
                <i class="fas fa-cogs fa-3x text-warning"></i>
                <h3 class="mt-3">Easily</h3>
                <p>Friendly user's interface</p>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 MyWebsite. All Rights Reserved.</p>
        <div class="social-icons">
            <a href="https://www.facebook.com/nguyen.quyen.847427" target="_blank"><i class="fab fa-facebook"></i></a>
            <a href="#"><i class="fab fa-twitter"></i></a>
            <a href="https://www.linkedin.com/in/nguyen-quyen-042214224/" target="_blank"><i class="fab fa-linkedin-in"></i></a>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</html>
